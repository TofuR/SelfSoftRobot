<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44566b"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrFb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8c9b"/></marker>
  </defs>

  <!-- ============ Lane A: 动作 ============ -->
  <text x="30" y="28" font-size="13" fill="#2980b9" font-weight="bold">动作 lane</text>
  <g><rect x="30" y="55" width="150" height="54" rx="8" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/>
     <text x="105" y="78" text-anchor="middle">动作窗口 aw_t</text>
     <text x="105" y="97" text-anchor="middle" font-size="11" fill="#555">(B, K, D) 最近 K 步气压</text></g>
  <g><rect x="220" y="55" width="180" height="54" rx="8" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/>
     <text x="310" y="78" text-anchor="middle">时序编码器 TemporalEncoder</text>
     <text x="310" y="97" text-anchor="middle" font-size="11" fill="#555">fractional / EMA / GRU / …</text></g>
  <g><rect x="430" y="55" width="180" height="54" rx="8" fill="#dbeefe" stroke="#2980b9" stroke-width="1.5"/>
     <text x="520" y="76" text-anchor="middle">cond (B, hidden)</text>
     <text x="520" y="94" text-anchor="middle" font-size="11" fill="#555">当前动作编码 · 每步重算 · 无记忆</text></g>
  <line x1="180" y1="82" x2="216" y2="82" stroke="#44566b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="400" y1="82" x2="426" y2="82" stroke="#44566b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ Lane B: 迟滞潜变量 z ============ -->
  <text x="30" y="200" font-size="13" fill="#c0392b" font-weight="bold">迟滞潜变量 z lane</text>
  <g><rect x="30" y="215" width="150" height="54" rx="8" fill="#fde8ef" stroke="#c0392b" stroke-width="1.5"/>
     <text x="105" y="238" text-anchor="middle">z_{t-1} (B, z_dim)</text>
     <text x="105" y="257" text-anchor="middle" font-size="11" fill="#555">上一步潜状态</text></g>
  <g><rect x="220" y="207" width="200" height="70" rx="8" fill="#fde8ef" stroke="#c0392b" stroke-width="1.5"/>
     <text x="320" y="229" text-anchor="middle">GRUCell  Φ_z</text>
     <text x="320" y="247" text-anchor="middle" font-size="11">z_t = Φ_z( [cond, s_{t-1}], z_{t-1} )</text>
     <text x="320" y="265" text-anchor="middle" font-size="11" fill="#555">门控 · 有界 · 编码迟滞(无真值)</text></g>
  <g><rect x="450" y="215" width="160" height="54" rx="8" fill="#fde8ef" stroke="#c0392b" stroke-width="1.5"/>
     <text x="530" y="240" text-anchor="middle">z_proj</text>
     <text x="530" y="258" text-anchor="middle" font-size="11" fill="#555">加性注入每节点</text></g>
  <line x1="180" y1="242" x2="216" y2="242" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrR)"/>
  <line x1="420" y1="242" x2="446" y2="242" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrR)"/>
  <!-- cond -> z-cell (down) -->
  <path d="M520,109 L520,160 L320,160 L320,205" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <text x="330" y="155" font-size="10.5" fill="#c0392b">cond</text>
  <!-- s_{t-1} -> z-cell flatten (up from lane C) -->
  <path d="M105,375 L105,300 L260,300 L260,278" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <text x="112" y="312" font-size="10.5" fill="#c0392b">flatten(s_{t-1})</text>

  <!-- ============ Lane C: 形状状态 ============ -->
  <text x="30" y="362" font-size="13" fill="#27ae60" font-weight="bold">形状状态 lane</text>
  <g><rect x="30" y="375" width="150" height="46" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
     <text x="105" y="403" text-anchor="middle">s_{t-1} (B, N, 3)</text></g>
  <g><rect x="30" y="430" width="150" height="40" rx="8" fill="#eef7f1" stroke="#27ae60" stroke-width="1.3"/>
     <text x="105" y="455" text-anchor="middle" font-size="11">s_{t-2} (前两步)</text></g>
  <g><rect x="220" y="383" width="180" height="46" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
     <text x="310" y="411" text-anchor="middle">v = s_{t-1} − s_{t-2}</text></g>
  <g><rect x="430" y="378" width="180" height="56" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
     <text x="520" y="400" text-anchor="middle">状态编码器 StateEncoder</text>
     <text x="520" y="420" text-anchor="middle" font-size="11" fill="#555">[s_{t-1}, v] → h₀ (空间GRU种子)</text></g>
  <line x1="180" y1="406" x2="216" y2="406" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="105" y1="430" x2="105" y2="416" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="400" y1="406" x2="426" y2="406" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ 汇聚: 沿臂空间 GRU ============ -->
  <g><rect x="670" y="120" width="250" height="150" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.8"/>
     <text x="795" y="145" text-anchor="middle" font-weight="bold" fill="#6c3483">沿臂空间 GRU (base → tip)</text>
     <text x="795" y="166" text-anchor="middle" font-size="11.5">悬臂因果: 基座→末端逐节点传播</text>
     <text x="795" y="190" text-anchor="middle" font-size="11.5">种子: h₀</text>
     <text x="795" y="212" text-anchor="middle" font-size="11.5">逐节点输入:</text>
     <text x="795" y="232" text-anchor="middle" font-size="11.5">cond + z_proj + z_embed(ζ)</text>
     <text x="795" y="252" text-anchor="middle" font-size="10.5" fill="#555">ζ = 沿中心线位置 [-1,1]</text></g>

  <!-- cond -> sgru -->
  <path d="M610,82 L640,82 L640,150 L666,150" fill="none" stroke="#44566b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="628" y="120" font-size="10.5" fill="#555">cond</text>
  <!-- z_proj -> sgru -->
  <path d="M610,242 L640,242 L640,220 L666,220" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="618" y="236" font-size="10.5" fill="#c0392b">z_proj</text>
  <!-- h0 -> sgru (up) -->
  <path d="M610,406 L640,406 L640,262 L666,262" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="618" y="360" font-size="10.5" fill="#27ae60">h₀ 种子</text>

  <!-- 增量头 + 收缩 -->
  <g><rect x="670" y="300" width="250" height="58" rx="8" fill="#fef9e7" stroke="#e08e0b" stroke-width="1.5"/>
     <text x="795" y="323" text-anchor="middle">增量头 + 收缩</text>
     <text x="795" y="345" text-anchor="middle" font-size="11.5">Δ = clamp(δ_scale, ≤1.0) · tanh( delta_head )</text></g>
  <line x1="795" y1="270" x2="795" y2="298" stroke="#44566b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 输出 (s_t 与 z_t 都喂回) -->
  <g><rect x="670" y="384" width="250" height="74" rx="8" fill="#fef9e7" stroke="#e08e0b" stroke-width="1.8"/>
     <text x="795" y="406" text-anchor="middle" font-weight="bold">输出</text>
     <text x="795" y="427" text-anchor="middle" font-size="12">s_t = s_{t-1} + Δ &#160;(B, N, 3)</text>
     <text x="795" y="447" text-anchor="middle" font-size="11" fill="#c0392b">+ z_t (B, z_dim)</text></g>
  <line x1="795" y1="358" x2="795" y2="382" stroke="#44566b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- s_{t-1} 残差加到输出 (绕底部, 避开 lane C 的 v/StateEncoder 框) -->
  <path d="M30,398 L15,398 L15,506 L695,506 L695,458" fill="none" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="355" y="500" text-anchor="middle" font-size="10.5" fill="#27ae60">s_{t-1} 残差连接 (只预测增量 Δ)</text>

  <!-- 自回归反馈: 输出 (s_t, z_t) 经自循环喂回为下一步输入 (s_{t-1}, z_{t-1}) -->
  <path d="M920,430 C1018,430 1018,400 920,400" fill="none" stroke="#7f8c9b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrFb)"/>
  <text x="1030" y="380" font-size="11" fill="#7f8c9b" font-style="italic">↻ 自回归 rollout</text>
  <text x="1030" y="397" font-size="10.5" fill="#7f8c9b">(s_t, z_t) →</text>
  <text x="1030" y="412" font-size="10.5" fill="#7f8c9b">下一步 (s_{t-1}, z_{t-1})</text>

</svg>